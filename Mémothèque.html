body{font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;height:100vh;display:flex;background:#f0f4f8;font-size:13px;}
/* Scrollbars */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#c8d4e0;border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}
/* Sidebar */
.sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #e2eaf2;display:flex;flex-direction:column;height:100vh;z-index:10;}
.sb-logo{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2eaf2;background:#0056A0;}
.sb-logo-icon{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:-.5px;}
.sb-logo-text{color:#fff;font-size:10.5px;font-weight:600;line-height:1.3;}
.sb-logo-sub{color:rgba(255,255,255,.7);font-size:9.5px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;cursor:pointer;transition:background .12s;position:relative;}
.nav-item:hover{background:#f5f8fc;}
.nav-item.active{background:#EBF3FC;}
.nav-item-ic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.nav-item-body{flex:1;}
.nav-item-label{font-size:11.5px;font-weight:500;color:#3a4a5a;line-height:1.3;padding-top:2px;}
.nav-item.active .nav-item-label{color:#0056A0;font-weight:600;}
.nav-item-sub{font-size:10.5px;color:#88a0b8;margin-top:1px;}
.nav-subnav{padding:2px 0 6px 54px;}
.nav-sub-item{font-size:11px;color:#667;padding:4px 10px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px;}
.nav-sub-item:hover{background:#eef3fa;color:#0056A0;}
.nav-sub-item.active{color:#0056A0;font-weight:600;background:#ddeaf8;}
.nav-sub-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sb-user{border-top:1px solid #e2eaf2;padding:11px 14px;display:flex;align-items:center;gap:9px;}
.user-av{width:30px;height:30px;border-radius:50%;background:#0056A0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;}
.user-nm{font-size:11.5px;font-weight:600;color:#2a3a4a;}
.user-rl{font-size:10.5px;color:#8a9ab0;}
/* Main */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
/* Topbar */
.topbar{background:#fff;border-bottom:1px solid #e2eaf2;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:54px;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:700;color:#1a2a3a;}
.topbar-title span{color:#0056A0;}
.search-wrap{position:relative;}
.search-input{border:1px solid #d0dae6;border-radius:22px;padding:8px 16px 8px 38px;font-size:12.5px;width:310px;outline:none;transition:border .15s,box-shadow .15s;background:#f7fafc;color:#2a3a4a;}
.search-input::placeholder{color:#aab8c8;}
.search-input:focus{border-color:#0056A0;background:#fff;box-shadow:0 0 0 3px rgba(0,86,160,.1);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#aab8c8;}
.search-drop{position:absolute;top:calc(100% + 5px);right:0;width:420px;background:#fff;border:1px solid #dde6f0;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:200;overflow:hidden;}
.sd-header{padding:8px 14px;font-size:11px;color:#8a9ab0;background:#f8fafc;border-bottom:1px solid #eef2f8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.sd-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid #f2f5f9;display:flex;gap:10px;align-items:flex-start;}
.sd-item:last-child{border-bottom:none;}
.sd-item:hover{background:#f5f9ff;}
.sd-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;}

.sd-path{font-size:10.5px;color:#8a9ab0;margin-top:1px;}
.sd-empty{padding:20px;text-align:center;color:#aab8c8;font-size:12px;}

.filter-lbl{font-size:11.5px;color:#667;font-weight:600;}

.filter-sel:focus{border-color:#0056A0;}
.filter-sep{width:1px;height:20px;background:#e2eaf2;}
.filter-desc{font-size:11.5px;color:#9ab0c8;margin-left:auto;font-style:italic;}
/* Favbar */
.favbar{background:#fff;border-bottom:2px solid #e2eaf2;padding:0 20px;display:flex;align-items:center;gap:6px;height:40px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.favbar::-webkit-scrollbar{display:none;}
.fav-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;white-space:nowrap;cursor:pointer;transition:all .12s;border:1.5px solid transparent;user-select:none;}
.fav-chip.frequent{background:#0056A0;color:#fff;font-weight:700;border-color:#0056A0;}
.fav-chip.normal{background:#f0f4fa;color:#2a5080;border-color:#c8daf0;}
.fav-chip.normal:hover{background:#e0eaf7;border-color:#aac5e8;}
.fav-chip.active-fav{background:#ddeaf8;border-color:#0056A0;color:#0056A0;font-weight:600;}
.fav-x{font-size:10px;color:#8ab0d0;margin-left:2px;line-height:1;}
.fav-x:hover{color:#c0392b;}

.them-hdr:hover{background:#f5f8fc;}
.them-hdr-ic{font-size:13px;}
.them-hdr-txt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ab0c8;flex:1;}
.them-hdr-chev{font-size:9px;color:#c0ccd8;transition:transform .2s;margin-left:auto;}
.them-hdr-chev.collapsed{transform:rotate(-90deg);}

.star-btn{background:none;border:none;cursor:pointer;padding:3px 4px;font-size:14px;line-height:1;color:#c8d8e8;transition:color .15s,transform .15s;flex-shrink:0;}

.fonc-list{border-top:1px solid #e8f0f8;background:#fafcff;}
.fonc-row{display:flex;align-items:center;padding:9px 15px;gap:10px;border-bottom:1px solid #edf2f8;transition:background .1s;}

.mbtn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap;transition:all .12s;flex-shrink:0;}

.mbtn.pdf:hover{background:#ffe0d8;}
.mbtn.video{background:#EBF3FC;color:#0056A0;border:1px solid #a8c8f0;}
.mbtn.video:hover{background:#d8eafa;}
.mbtn.cours{background:#edf8f2;color:#1a7a42;border:1px solid #9ad4b4;}
.mbtn.cours:hover{background:#d8f0e4;}
.no-foncs{padding:12px 15px;font-size:12px;color:#9ab0c8;font-style:italic;}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:40px;text-align:center;}
.empty-ic{font-size:44px;opacity:.3;}
.empty-txt{font-size:13.5px;color:#9ab0c8;line-height:1.5;}
/* Search highlight */
mark{background:#fff3a3;border-radius:2px;padding:0 1px;}
/* Transition */
.fonc-anim{animation:slideDown .18s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

function getToolColor(outil) {
  for (const key of Object.keys(TOOL_COLORS)) {
    if (outil && outil.includes(key.split(" / ")[0])) return TOOL_COLORS[key];
  }
  return defaultTool;
}

function detectType(nom, url) {
  if (!url) return null;
  if (url.includes("/mod/hvp/")) return "video";
  if (url.includes("/mod/resource/")) return "pdf";
  if (url.includes("/course/")) return "cours";
  if (nom.toLowerCase().includes("pdf")) return "pdf";
  if (nom.toLowerCase().includes("vidéo") || nom.toLowerCase().includes("video")) return "video";
  return "lien";
}

let _idCtr = 0;
function uid() { return "id" + (++_idCtr); }

function buildHierarchy(raw) {
  const themsMap = new Map();
  raw.forEach(([them, chap, comp, outil, foncs]) => {
    if (!themsMap.has(them)) themsMap.set(them, { id: uid(), nom: them, chapitres: new Map() });
    const themObj = themsMap.get(them);
    if (!themObj.chapitres.has(chap)) themObj.chapitres.set(chap, { id: uid(), nom: chap, competences: [] });
    themObj.chapitres.get(chap).competences.push({
      id: uid(), nom: comp, outil,
      fonctionnalites: foncs.map(([nom, url]) => ({ id: uid(), nom, url, type: detectType(nom, url) }))
    });
  });
  return Array.from(themsMap.values()).map(t => ({
    ...t,
    chapitres: Array.from(t.chapitres.values())
  }));
}

const HIERARCHY = buildHierarchy(RAW);

// Helpers to safely get chapitres/competences by partial name
function findChap(themIdx, partialName) {
  const them = HIERARCHY[themIdx];
  if (!them) return null;
  return them.chapitres.find(c => c.nom.includes(partialName)) || them.chapitres[0];
}
function findComp(chap, partialName) {
  if (!chap) return null;
  return chap.competences.find(c => c.nom.includes(partialName)) || chap.competences[0];
}

const compConstantes = findComp(chapDossier, "constantes");
const compTransmissions = findComp(chapDossier, "transmissions");

function ToolBadge({ outil }) {
  if (!outil) return null;
  const c = getToolColor(outil);
  // Show only first part if compound
  const display = outil.split(" / ")[0].split("\n")[0];
  return (
    <span className="tbadge" style={{ background: c.bg, color: c.text, border: `1px solid ${c.border}` }}>
      {display}
    </span>
  );
}

function MediaBtn({ type, url, nom }) {
  if (!type || !url) return null;
  const icons = { pdf: "📄", video: "▶", cours: "🎓", lien: "🔗" };
  const labels = { pdf: "PDF", video: "Vidéo", cours: "Formation", lien: "Lien" };
  const href = url.startsWith("https://") ? url : `https://formaphp.fr/mod/hvp/view.php?id=${url.split("-")[0]}`;
  return (
    <a className={`mbtn ${type}`} href={href} target="_blank" rel="noopener" onClick={e => e.stopPropagation()}>
      <span>{icons[type]}</span>
      <span>{labels[type]}</span>
    </a>
  );
}

function FoncRow({ fonc, highlight }) {
  function hl(text) {
    if (!highlight) return text;
    const idx = text.toLowerCase().indexOf(highlight.toLowerCase());
    if (idx < 0) return text;
    return <>{text.slice(0, idx)}<mark>{text.slice(idx, idx + highlight.length)}</mark>{text.slice(idx + highlight.length)}</>;
  }
  return (
    <div className="fonc-row">
      <span className="fonc-nm">{hl(fonc.nom)}</span>
      <ToolBadge outil={fonc._outil || ""} />
      <MediaBtn type={fonc.type} url={fonc.url} nom={fonc.nom} />
    </div>
  );
}

function CompCard({ comp, chapId, isOpen, onToggle, highlight, favorites, onToggleFav }) {
  const count = comp.fonctionnalites.length;
  const isFav = favorites.some(f => f.compId === comp.id);
  function hl(text) {
    if (!highlight) return text;
    const idx = text.toLowerCase().indexOf(highlight.toLowerCase());
    if (idx < 0) return text;
    return <>{text.slice(0, idx)}<mark>{text.slice(idx, idx + highlight.length)}</mark>{text.slice(idx + highlight.length)}</>;
  }
  function handleStar(e) {
    e.stopPropagation();
    onToggleFav({ chapId, compId: comp.id, label: comp.nom.replace(/^\d+\.\d+ - /, "").slice(0, 40) });
  }
  return (
    <div className="comp-card">
      <div className={`comp-hdr${isOpen ? " open" : ""}`} onClick={onToggle}>
        <span className="comp-nm">{hl(comp.nom)}</span>
        <div className="comp-meta">
          <ToolBadge outil={comp.outil} />
          {count > 0 && <span className="comp-cnt">{count} fiche{count > 1 ? "s" : ""}</span>}
        </div>
        <button className={`star-btn${isFav ? " starred" : ""}`} onClick={handleStar} title={isFav ? "Retirer des favoris" : "Ajouter aux favoris"}>
          {isFav ? "★" : "☆"}
        </button>
        {count > 0 && <span className={`comp-chev${isOpen ? " open" : ""}`}>▼</span>}
      </div>
      {isOpen && count > 0 && (
        <div className="fonc-list fonc-anim">
          {comp.fonctionnalites.map(f => (
            <FoncRow key={f.id} fonc={{ ...f, _outil: comp.outil }} highlight={highlight} />
          ))}
        </div>
      )}
      {isOpen && count === 0 && (
        <div className="no-foncs fonc-anim">Contacter l'équipe Adoption pour la création de ce tuto</div>
      )}
    </div>
  );
}

function ChapterNav({ hierarchy, selectedChapId, onSelect }) {
  const [collapsed, setCollapsed] = useState(new Set());
  function toggleThem(id) {
    setCollapsed(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  const themIcons = {
    "Prise en charge patient": "🏥",
    "Basiques numérique": "💻",
    "Culture santé et numérique": "🌐",
    "Sécurité numérique": "🔒",
    "Hors soins": "📋",
  };
  return (
    <nav className="chap-nav">
      {hierarchy.map(them => {
        const allFoncs = them.chapitres.reduce((s, c) => s + c.competences.reduce((s2, cc) => s2 + cc.fonctionnalites.length, 0), 0);
        return (
          <div key={them.id}>
            <div className="them-hdr" onClick={() => toggleThem(them.id)}>
              <span className="them-hdr-ic">{themIcons[them.nom] || "📁"}</span>
              <span className="them-hdr-txt">{them.nom}</span>
              <span className={`them-hdr-chev${collapsed.has(them.id) ? " collapsed" : ""}`}>▼</span>
            </div>
            {!collapsed.has(them.id) && them.chapitres.map(chap => {
              const foncCount = chap.competences.reduce((s, c) => s + c.fonctionnalites.length, 0);
              const active = chap.id === selectedChapId;
              return (
                <div
                  key={chap.id}
                  className={`chap-item${active ? " active" : ""}`}
                  onClick={() => onSelect(chap.id)}
                  data-screen-label={chap.nom}
                >
                  <span className="chap-nm">{chap.nom.replace(/^\d+ - /, "")}</span>
                  {foncCount > 0 && <span className="chap-badge">{foncCount}</span>}
                  <span className="chap-chevron">›</span>
                </div>
              );
            })}
          </div>
        );
      })}
    </nav>
  );
}

function SearchDropdown({ results, onPick, query }) {
  if (!query.trim()) return null;
  const icons = { competence: "📌", fonctionnalite: "🔗" };
  const typeBg = { competence: "#EBF3FC", fonctionnalite: "#FFF0F0" };
  const typeColor = { competence: "#0056A0", fonctionnalite: "#C0392B" };
  if (results.length === 0) return (
    <div className="search-drop"><div className="sd-empty">Aucun résultat pour « {query} »</div></div>
  );
  return (
    <div className="search-drop">
      <div className="sd-header">{results.length} résultat{results.length > 1 ? "s" : ""}</div>
      {results.map((r, i) => (
        <div key={i} className="sd-item" onClick={() => onPick(r)}>
          <div className="sd-icon" style={{ background: typeBg[r.type], color: typeColor[r.type] }}>
            {r.type === "competence" ? "📌" : "📄"}
          </div>
          <div className="sd-body">
            <div className="sd-name">{r.type === "fonctionnalite" ? r.fonc.nom : r.comp.nom}</div>
            <div className="sd-path">{r.them.nom} › {r.chap.nom.replace(/^\d+ - /, "")}
              {r.type === "fonctionnalite" && ` › ${r.comp.nom}`}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [selectedChapId, setSelectedChapId] = useState(DEFAULT_CHAP);
  const [expandedComps, setExpandedComps] = useState(new Set([DEFAULT_COMP]));
  const [searchQuery, setSearchQuery] = useState("");
  const [showSearch, setShowSearch] = useState(false);
  const [metier, setMetier] = useState("Tous");
  const [specialite, setSpecialite] = useState("Toutes");
  const [favorites, setFavorites] = useState(DEFAULT_FAVS);

  function toggleFavorite({ chapId, compId, label }) {
    setFavorites(prev => {
      const exists = prev.find(f => f.compId === compId);
      if (exists) return prev.filter(f => f.compId !== compId);
      return [...prev, { id: uid(), label, chapId, compId }];
    });
  }
  const searchRef = useRef();

  // Close search on outside click
  useEffect(() => {
    function handler(e) {
      if (searchRef.current && !searchRef.current.contains(e.target)) {
        setShowSearch(false);
      }
    }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  // Find current chapitre and thematique
  const { chapitre, thematique } = useMemo(() => {
    for (const them of HIERARCHY) {
      for (const chap of them.chapitres) {
        if (chap.id === selectedChapId) return { chapitre: chap, thematique: them };
      }
    }
    return { chapitre: null, thematique: null };
  }, [selectedChapId]);

  // Search results
  const searchResults = useMemo(() => {
    if (!searchQuery.trim()) return [];
    const q = searchQuery.toLowerCase();
    const res = [];
    for (const them of HIERARCHY) {
      for (const chap of them.chapitres) {
        for (const comp of chap.competences) {
          if (comp.nom.toLowerCase().includes(q)) res.push({ type: "competence", them, chap, comp });
          for (const fonc of comp.fonctionnalites) {
            if (fonc.nom.toLowerCase().includes(q)) res.push({ type: "fonctionnalite", them, chap, comp, fonc });
          }
        }
      }
    }
    return res.slice(0, 15);
  }, [searchQuery]);

  function toggleComp(compId) {
    setExpandedComps(prev => {
      const next = new Set(prev);
      if (next.has(compId)) next.delete(compId);
      else next.add(compId);
      return next;
    });
  }

  function selectChap(chapId) {
    setSelectedChapId(chapId);
    setExpandedComps(new Set());
  }

  function pickSearchResult(r) {
    setSelectedChapId(r.chap.id);
    const newExp = new Set();
    newExp.add(r.comp.id);
    setExpandedComps(newExp);
    setSearchQuery("");
    setShowSearch(false);
    // Scroll to comp after render
    setTimeout(() => {
      const el = document.querySelector(`[data-comp-id="${r.comp.id}"]`);
      if (el) el.scrollIntoView({ block: "center" });
    }, 80);
  }

  function pickFavorite(fav) {
    setSelectedChapId(fav.chapId);
    const newExp = new Set([fav.compId]);
    setExpandedComps(newExp);
  }

  function removeFav(id, e) {
    e.stopPropagation();
    setFavorites(f => f.filter(x => x.id !== id));
  }

  return (
    <div style={{ display: "flex", height: "100vh", width: "100%", overflow: "hidden" }}>
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-icon">FP</div>
          <div>
            <div className="sb-logo-text">FORMAPHP</div>
            <div className="sb-logo-sub">AP-HP</div>
          </div>
        </div>
        <nav className="sb-nav">
          <NavItem icon="▶" label="Mes formations en cours" sub="4 formations actives" />
          <NavItem icon="📚" label="Je consulte les e-learnings et les formations présentielles" />
          <NavItem icon="📋" label="Les tutoriels logiciels" sub="Je consulte les tutoriels de mes logiciels" active={true}
            subItems={["Par métier", "Par logiciel"]} activeSubItem="Par métier" />
          <NavItem icon="🏅" label="Mes attestations" sub="Certifications obtenues" />
          <NavItem icon="✉️" label="Contacter l'équipe Adoption" sub="adoption@aphp.fr" href="mailto:adoption@aphp.fr" />
        </nav>
        <div className="sb-user">
          <div className="user-av">CL</div>
          <div>
            <div className="user-nm">Claire L.</div>
            <div className="user-rl">IDE · Urgences</div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <div className="main">
        {/* Topbar */}
        <header className="topbar">
          <div>
            <div className="topbar-title">Les tutoriels des logiciels de <span>l'AP-HP</span></div>
          </div>
          <div className="search-wrap" ref={searchRef}>
            <span className="search-icon">🔍</span>
            <input
              className="search-input"
              placeholder="Rechercher un mode opératoire…"
              value={searchQuery}
              onChange={e => { setSearchQuery(e.target.value); setShowSearch(true); }}
              onFocus={() => setShowSearch(true)}

            onToggleFav={toggleFavorite}
          />
        </div>
      </div>
    </div>
  );
}

function NavItem({ icon, label, sub, active, subItems, activeSubItem, href }) {
  const content = (
    <div>
      <div className={`nav-item${active ? " active" : ""}`} style={href ? {cursor:"pointer"} : {}}>
        <div className="nav-item-ic" style={{ background: active ? "#EBF3FC" : "#f5f7fa" }}>
          {icon}
        </div>
        <div className="nav-item-body">
          <div className="nav-item-label">{label}</div>
          {sub && <div className="nav-item-sub">{sub}</div>}
        </div>
      </div>
      {active && subItems && (
        <div className="nav-subnav">
          {subItems.map(s => (
            <div key={s} className={`nav-sub-item${s === activeSubItem ? " active" : ""}`}>
              <span className="nav-sub-dot"></span>
              {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
  if (href) return <a href={href} style={{textDecoration:"none"}}>{content}</a>;
  return content;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
